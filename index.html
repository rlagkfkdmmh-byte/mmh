<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Rhythm Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050510;
            color: white;
            font-family: 'Inter', sans-serif;
            user-select: none;
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none; /* 추가: 모바일 터치 시 화면 스크롤/확대 방지 */
        }

        .neon-text {
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.8), 0 0 20px rgba(0, 255, 255, 0.5);
        }

        .neon-text-pink {
            text-shadow: 0 0 10px rgba(255, 0, 255, 0.8), 0 0 20px rgba(255, 0, 255, 0.5);
        }

        /* UI Overlays */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 16, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            z-index: 10;
        }

        .btn-glowing {
            background: transparent;
            border: 2px solid #00ffff;
            color: #00ffff;
            padding: 15px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4) inset, 0 0 15px rgba(0, 255, 255, 0.4);
        }

        .btn-glowing:hover {
            background: #00ffff;
            color: #000;
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.8) inset, 0 0 25px rgba(0, 255, 255, 0.8);
        }

        #judgement-display {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3rem;
            font-weight: 900;
            opacity: 0;
            transition: opacity 0.1s;
        }

        .perfect { color: #00ffff; text-shadow: 0 0 20px #00ffff; }
        .great { color: #00ff00; text-shadow: 0 0 20px #00ff00; }
        .miss { color: #ff0044; text-shadow: 0 0 20px #ff0044; }

        /* 새로운 판정 컬러 추가 */
        .good { color: #ffaa00; text-shadow: 0 0 20px #ffaa00; }

        #combo-display {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 4rem;
            font-weight: 900;
            color: white;
            text-shadow: 0 0 10px #fff;
            opacity: 0;
        }

        /* 체력바(HP) 스타일 추가 */
        #health-bar-container {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 400px;
            height: 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #555;
            border-radius: 10px;
            overflow: hidden;
            z-index: 5;
        }
        #health-bar {
            width: 100%;
            height: 100%;
            background: #00ff00;
            transition: width 0.2s ease, background-color 0.2s ease;
            box-shadow: 0 0 10px #00ff00;
        }

        /* File Input Styling */
        input[type="file"] {
            display: none;
        }
        .file-upload-label {
            margin-top: 20px;
            padding: 10px 20px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            color: #ccc;
            transition: all 0.2s;
        }
        .file-upload-label:hover {
            background: rgba(255,255,255,0.2);
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- 3D Canvas -->
    <canvas id="gameCanvas"></canvas>

    <!-- UI Overlay -->
    <div id="ui-layer" class="p-6">
        <!-- 체력바 UI -->
        <div id="health-bar-container">
            <div id="health-bar"></div>
        </div>

        <div class="flex flex-col md:flex-row justify-between items-start md:items-center w-full max-w-4xl mx-auto gap-4 md:gap-0 mt-8 md:mt-0">
            <!-- 기존 점수 대신 상세 판정 통계 보드로 교체 -->
            <div class="bg-black/60 p-4 rounded-xl border border-gray-700 text-sm font-mono font-bold space-y-1 w-full md:w-auto">
                <div class="text-cyan-300">PERFECT: <span id="stat-perfect">0</span></div>
                <div class="text-green-400">GREAT: <span id="stat-great">0</span></div>
                <div class="text-orange-400">GOOD: <span id="stat-good">0</span></div>
                <div class="text-red-500 mt-2 border-t border-gray-600 pt-1">MISS: <span id="stat-miss">0</span></div>
            </div>
            <div class="text-left md:text-right w-full md:w-auto">
                <div class="text-xl font-bold text-gray-300" id="song-title">Song: IRIS OUT</div>
                <div class="text-md text-cyan-300 font-mono mt-1 mb-1" id="time-display">남은 시간: 00:00 / 전체: 00:00</div>
                <div class="text-sm text-gray-500">Keys: D, F, J, K (모바일은 화면 4등분 터치)</div>
            </div>
        </div>
        
        <div id="judgement-display">PERFECT</div>
        <div id="combo-display">12</div>
    </div>

    <!-- Start / Upload Screen -->
    <div id="start-screen">
        <h1 class="text-6xl font-black mb-4 neon-text tracking-widest">IRIS OUT</h1>
        <p class="text-xl mb-12 text-gray-400">3D Rhythm Action</p>
        
        <button id="start-btn" class="btn-glowing mb-6">GAME START</button>
        
        <label class="file-upload-label">
            🎵 커스텀 음악 파일(IRIS OUT.m4a 등) 업로드
            <input type="file" id="audio-upload" accept="audio/*">
        </label>
        <p class="mt-2 text-sm text-gray-500" id="upload-status">기본 음악이 재생됩니다.</p>
    </div>

    <!-- Audio Element (IRIS OUT.m4a) -->
    <audio id="game-audio" src="IRIS OUT.m4a"></audio>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const audio = document.getElementById('game-audio');
    
    // UI Elements
    const startScreen = document.getElementById('start-screen');
    const startBtn = document.getElementById('start-btn');
    
    // 판정 통계 UI 엘리먼트 가져오기
    const statEls = {
        perfect: document.getElementById('stat-perfect'),
        great: document.getElementById('stat-great'),
        good: document.getElementById('stat-good'),
        miss: document.getElementById('stat-miss')
    };

    const judgeText = document.getElementById('judgement-display');
    const comboText = document.getElementById('combo-display');
    const audioUpload = document.getElementById('audio-upload');
    const uploadStatus = document.getElementById('upload-status');
    const songTitle = document.getElementById('song-title');
    const timeDisplay = document.getElementById('time-display');
    const healthBar = document.getElementById('health-bar'); // 체력바 요소 추가

    // Game Config
    let isPlaying = false;
    let stats = { perfect: 0, great: 0, good: 0, miss: 0 };
    let combo = 0;
    
    // 체력 시스템 변수 추가
    const maxHealth = 100;
    let currentHealth = 100;

    const keys = ['KeyD', 'KeyF', 'KeyJ', 'KeyK']; // 한/영 키 입력 상태에 영향받지 않도록 e.code 사용
    const laneColors = ['#c084fc', '#ff7b00', '#ff7b00', '#c084fc']; // Reze(연보라), Denji(주황), Denji(주황), Reze(연보라)
    const keyState = [false, false, false, false];
    
    // Timing & Physics
    const noteSpeed = 0.9; // 속도 대폭 증가 (기존 1.2 -> 0.9)
    const hitWindowPerfect = 0.05; // +/- 50ms (정확)
    const hitWindowGreat = 0.11; // +/- 110ms (빠름/느림)
    const hitWindowMiss = 0.20; // +/- 200ms (매우빠름/매우느림)

    // 3D Perspective Config (반응형을 위해 const에서 let으로 변경)
    const topY = 200; // Horizon Y position
    let topWidth = 150; // Total width of lanes at horizon
    let bottomWidth = 800; // Total width of lanes at bottom
    let bottomY = 0; // Calculated based on window height

    // Note Data Structure
    // { time: float, lane: 0~3, type: 'short'|'long', duration: float, hit: boolean, active: boolean }
    let beatmap = [];
    
    // Visual Effects
    let hitEffects = []; // {lane, time, color}

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        bottomY = canvas.height * 0.85; // Hit line is near the bottom
        
        // 반응형: 모바일 화면일 경우 레인 넓이를 기기 폭에 맞게 축소
        if (window.innerWidth < 768) {
            topWidth = window.innerWidth * 0.6;
            bottomWidth = window.innerWidth * 0.95;
        } else {
            topWidth = 150;
            bottomWidth = 800;
        }
    }
    window.addEventListener('resize', resize);
    resize();

    // 시간 포맷팅 함수 (초 단위 -> mm:ss)
    function formatTime(seconds) {
        if (isNaN(seconds) || seconds < 0) return "00:00";
        let m = Math.floor(seconds / 60);
        let s = Math.floor(seconds % 60);
        return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    // 메타데이터가 로드되면 곡 길이에 맞춰 비트맵 생성
    audio.addEventListener('loadedmetadata', () => {
        generateBeatmap(audio.duration);
    });

    audioUpload.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const url = URL.createObjectURL(file);
            audio.src = url;
            uploadStatus.innerText = `적용됨: ${file.name}`;
            songTitle.innerText = `Song: ${file.name}`;
            
            audio.onloadedmetadata = () => {
                generateBeatmap(audio.duration);
            };
        }
    });

    function generateBeatmap(durationSec = 60) {
        if (isNaN(durationSec) || durationSec <= 0) durationSec = 60;
        beatmap = [];
        
        // 곡의 대략적인 템포(BPM) 설정 (음악 비트와 안맞으면 이 값을 140~180 사이로 조절해보세요)
        const bpm = 160; 
        const secPerBeat = 60 / bpm; // 1박자(4분음표)당 시간
        const secPerHalfBeat = secPerBeat / 2; // 반박자(8분음표)당 시간
        const secPerQuarterBeat = secPerBeat / 4; // 반의반박자(16분음표)당 시간

        // 곡 시작 후 첫 노트가 떨어지기 시작하는 시간 (전주 길이에 맞춰 조절)
        let time = 1.5; 
        
        while(time < durationSec - 2) {
            const pattern = Math.random();
            
            if (pattern < 0.15) {
                // [단일 정박] (15%) - 다음 타일이 나오는 시간을 반박자로 줄여 템포를 올림
                beatmap.push({ time: time, lane: Math.floor(Math.random() * 4), type: 'short', hit: false });
                time += secPerHalfBeat; 
            } else if (pattern < 0.30) {
                // [동시치기] (15%) - 두 손으로 동시에 치기
                let l1 = Math.floor(Math.random() * 2); // 0 or 1
                let l2 = l1 + 2; // 2 or 3
                beatmap.push({ time: time, lane: l1, type: 'short', hit: false });
                beatmap.push({ time: time, lane: l2, type: 'short', hit: false });
                time += secPerBeat; 
            } else if (pattern < 0.60) {
                // [8비트 4연타 폭타] (30%) - 노트 밀도 대폭 증가 (따-따-따-따)
                let startLane = Math.floor(Math.random() * 2);
                beatmap.push({ time: time, lane: startLane, type: 'short', hit: false });
                beatmap.push({ time: time + secPerHalfBeat, lane: startLane + 1, type: 'short', hit: false });
                beatmap.push({ time: time + secPerHalfBeat * 2, lane: startLane === 0 ? 2 : 1, type: 'short', hit: false });
                beatmap.push({ time: time + secPerHalfBeat * 3, lane: Math.floor(Math.random() * 4), type: 'short', hit: false });
                time += secPerBeat * 2;
            } else if (pattern < 0.85) {
                // [16비트 빠른 4연타] (25%) - 순간적으로 엄청 쏟아짐 (다다다닥)
                let startLane = Math.floor(Math.random() * 2);
                beatmap.push({ time: time, lane: startLane, type: 'short', hit: false });
                beatmap.push({ time: time + secPerQuarterBeat, lane: startLane + 1, type: 'short', hit: false });
                beatmap.push({ time: time + secPerQuarterBeat * 2, lane: startLane + 2, type: 'short', hit: false });
                beatmap.push({ time: time + secPerQuarterBeat * 3, lane: Math.floor(Math.random() * 4), type: 'short', hit: false });
                time += secPerBeat; // 1박자 안에 4개가 다 떨어짐
            } else {
                // [롱노트 복합 패턴] (15%) - 한 손으론 길게 누르고, 다른 손으론 짧게 치기
                let longLane = Math.floor(Math.random() * 4);
                let duration = secPerBeat * 1.5; // 1.5박자 롱노트
                
                beatmap.push({ time: time, lane: longLane, type: 'long', duration: duration, hit: false, active: false });
                
                // 롱노트 반대편에서 단일 타일들이 떨어짐
                let shortLane = (longLane + 2) % 4; 
                beatmap.push({ time: time + secPerHalfBeat, lane: shortLane, type: 'short', hit: false });
                beatmap.push({ time: time + secPerBeat, lane: (shortLane + 1) % 4, type: 'short', hit: false });
                
                time += duration + secPerHalfBeat;
            }
        }
        // Sort by time just in case
        beatmap.sort((a, b) => a.time - b.time);
    }

    // Initialize default beatmap
    generateBeatmap(60);

    // Helper to calculate X and Width at a specific Y or progress
    // Progress p: 0.0 (top/spawn) to 1.0 (bottom/hit line)
    function getPerspectiveMetrics(p) {
        // Easing to make it feel like 3D depth (objects move faster as they get closer)
        const depthCurve = Math.pow(p, 2.5); 
        
        const y = topY + (bottomY - topY) * depthCurve;
        const width = topWidth + (bottomWidth - topWidth) * depthCurve;
        const laneWidth = width / 4;
        const startX = (canvas.width / 2) - (width / 2);
        
        return { y, laneWidth, startX, width };
    }

    // 체력 업데이트 및 게임 오버 처리 함수
    function updateHealth(amount) {
        currentHealth += amount;
        if (currentHealth > maxHealth) currentHealth = maxHealth;
        
        let percent = (currentHealth / maxHealth) * 100;
        if (percent < 0) percent = 0;
        
        healthBar.style.width = percent + '%';
        
        // 체력 상태에 따른 색상 변경
        if (percent > 50) {
            healthBar.style.background = '#00ff00'; // Green
            healthBar.style.boxShadow = '0 0 10px #00ff00';
        } else if (percent > 20) {
            healthBar.style.background = '#ffaa00'; // Orange
            healthBar.style.boxShadow = '0 0 10px #ffaa00';
        } else {
            healthBar.style.background = '#ff0044'; // Red
            healthBar.style.boxShadow = '0 0 10px #ff0044';
        }

        // 체력이 0 이하가 되면 게임 오버
        if (currentHealth <= 0 && isPlaying) {
            triggerGameOver();
        }
    }

    function triggerGameOver() {
        isPlaying = false;
        audio.pause();
        startScreen.style.display = 'flex';
        document.querySelector('#start-screen h1').innerText = "GAME OVER";
        document.querySelector('#start-screen h1').className = "text-6xl font-black mb-4 neon-text-pink tracking-widest";
        document.querySelector('#start-screen p').innerText = `체력이 모두 소진되었습니다. PERFECT: ${stats.perfect} | MISS: ${stats.miss}`;
        startBtn.innerText = "RETRY";
    }

    window.addEventListener('keydown', (e) => {
        if(!isPlaying) return;
        const lane = keys.indexOf(e.code); // e.key 대신 e.code를 사용하여 한글/영문 상관없이 입력 받음
        if (lane !== -1 && !keyState[lane]) {
            keyState[lane] = true;
            handleHit(lane);
            triggerHitEffect(lane);
        }
    });

    window.addEventListener('keyup', (e) => {
        const lane = keys.indexOf(e.code); // e.key 대신 e.code 사용
        if (lane !== -1) {
            keyState[lane] = false;
            handleRelease(lane);
        }
    });

    // --- 모바일 터치 이벤트 추가 (멀티 터치 지원) ---
    const activeTouches = {}; // 터치 ID별 레인 저장

    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault(); // 스크롤 등 기본 터치 동작 방지
        if(!isPlaying) return;
        
        for (let i = 0; i < e.changedTouches.length; i++) {
            let touch = e.changedTouches[i];
            // 화면 너비를 4등분하여 터치한 X좌표로 레인(0~3) 계산
            let lane = Math.floor((touch.clientX / window.innerWidth) * 4);
            
            // 안전 장치: 레인이 0~3 사이일 때만 처리
            if (lane >= 0 && lane <= 3 && !keyState[lane]) {
                keyState[lane] = true;
                activeTouches[touch.identifier] = lane;
                handleHit(lane);
                triggerHitEffect(lane);
            }
        }
    }, {passive: false});

    canvas.addEventListener('touchend', (e) => {
        e.preventDefault();
        for (let i = 0; i < e.changedTouches.length; i++) {
            let touch = e.changedTouches[i];
            let lane = activeTouches[touch.identifier];
            
            if (lane !== undefined) {
                keyState[lane] = false;
                handleRelease(lane);
                delete activeTouches[touch.identifier];
            }
        }
    }, {passive: false});

    canvas.addEventListener('touchcancel', (e) => {
        e.preventDefault();
        for (let i = 0; i < e.changedTouches.length; i++) {
            let touch = e.changedTouches[i];
            let lane = activeTouches[touch.identifier];
            
            if (lane !== undefined) {
                keyState[lane] = false;
                handleRelease(lane);
                delete activeTouches[touch.identifier];
            }
        }
    }, {passive: false});
    // ---------------------------------

    function handleHit(lane) {
        const currentTime = audio.currentTime;
        
        // Find closest unhit note in this lane
        let closestNote = null;
        let minAbsDiff = Infinity;
        let actualDiff = 0; // 부호를 저장하여 빠름/느림 판단

        for (let i = 0; i < beatmap.length; i++) {
            let note = beatmap[i];
            if (note.lane === lane && !note.hit) {
                let diff = note.time - currentTime;
                
                // For long notes, if we are already pressing it, ignore initial hit check
                if (note.type === 'long' && note.active) continue;

                if (Math.abs(diff) < minAbsDiff && Math.abs(diff) < hitWindowMiss) {
                    minAbsDiff = Math.abs(diff);
                    closestNote = note;
                    actualDiff = diff;
                }
            }
        }

        if (closestNote) {
            // actualDiff > 0 : 노트를 너무 일찍 침
            // actualDiff < 0 : 노트를 너무 늦게 침

            if (minAbsDiff <= hitWindowPerfect) {
                showJudgement('PERFECT', 'perfect');
                stats.perfect++;
                combo++;
                updateHealth(1); // PERFECT 달성 시 체력 1 회복
                processHit(closestNote);
            } else if (minAbsDiff <= hitWindowGreat) {
                showJudgement('GREAT', 'great');
                stats.great++;
                combo++;
                updateHealth(0);
                processHit(closestNote);
            } else if (minAbsDiff <= hitWindowMiss) {
                showJudgement('GOOD', 'good');
                stats.good++;
                combo = 0;
                updateHealth(-3); // GOOD 판정 시 체력 3 감소
                closestNote.hit = true; // Mark as hit so we don't miss again
            }
            updateStatsUI();
        }
    }

    function processHit(note) {
        if (note.type === 'short') {
            note.hit = true;
        } else if (note.type === 'long') {
            note.active = true; // Start holding
        }
    }

    function handleRelease(lane) {
        const currentTime = audio.currentTime;
        
        // Find active long note in this lane
        for (let i = 0; i < beatmap.length; i++) {
            let note = beatmap[i];
            if (note.lane === lane && note.type === 'long' && note.active && !note.hit) {
                note.active = false;
                
                let endTime = note.time + note.duration;
                let diff = endTime - currentTime;
                let absDiff = Math.abs(diff);

                if (absDiff <= hitWindowPerfect) {
                    showJudgement('PERFECT', 'perfect');
                    stats.perfect++;
                    combo++;
                    updateHealth(1);
                    note.hit = true;
                } else if (absDiff <= hitWindowGreat) {
                    showJudgement('GREAT', 'great');
                    stats.great++;
                    combo++;
                    updateHealth(0);
                    note.hit = true;
                } else {
                    showJudgement('MISS', 'miss');
                    stats.miss++;
                    combo = 0;
                    updateHealth(-10); // 롱노트 끝을 놓치면 체력 10 감소
                    note.hit = true;
                }
                updateStatsUI();
                break;
            }
        }
    }

    let judgeTimeout;
    function showJudgement(text, className) {
        judgeText.innerText = text;
        judgeText.className = className;
        judgeText.style.opacity = '1';
        judgeText.style.transform = 'translate(-50%, -50%) scale(1.2)';
        
        comboText.innerText = combo > 4 ? `${combo} COMBO` : '';
        comboText.style.opacity = combo > 4 ? '1' : '0';
        comboText.style.transform = 'translate(-50%, -30%) scale(1.1)';

        clearTimeout(judgeTimeout);
        
        // Animate back to normal scale
        setTimeout(() => {
            judgeText.style.transform = 'translate(-50%, -50%) scale(1)';
            comboText.style.transform = 'translate(-50%, -30%) scale(1)';
        }, 50);

        judgeTimeout = setTimeout(() => {
            judgeText.style.opacity = '0';
            comboText.style.opacity = '0';
        }, 500);
    }

    function updateStatsUI() {
        statEls.perfect.innerText = stats.perfect;
        statEls.great.innerText = stats.great;
        statEls.good.innerText = stats.good;
        statEls.miss.innerText = stats.miss;
    }

    function triggerHitEffect(lane) {
        hitEffects.push({ lane: lane, time: performance.now(), color: laneColors[lane] });
    }

    function gameLoop() {
        if (!isPlaying) return;

        const currentTime = audio.currentTime;
        const duration = audio.duration || 0;
        const remainingTime = Math.max(0, duration - currentTime);
        
        // 남은 시간 / 전체 시간 UI 업데이트
        timeDisplay.innerText = `남은 시간: ${formatTime(remainingTime)} / 전체: ${formatTime(duration)}`;
        
        // Clear Canvas
        ctx.fillStyle = 'rgba(5, 5, 16, 0.8)'; // Slight trail effect
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw Highway Framework
        drawHighway();

        // Check for missed notes
        for (let i = 0; i < beatmap.length; i++) {
            let note = beatmap[i];
            
            if (!note.hit) {
                if (note.type === 'short' && currentTime > note.time + hitWindowMiss) {
                    note.hit = true;
                    combo = 0;
                    showJudgement('MISS', 'miss');
                    stats.miss++;
                    updateHealth(-10); // 숏노트 놓치면 체력 10 감소
                    updateStatsUI();
                } else if (note.type === 'long') {
                    // Missed starting the long note
                    if (!note.active && currentTime > note.time + hitWindowMiss) {
                         note.hit = true;
                         combo = 0;
                         showJudgement('MISS', 'miss');
                         stats.miss++;
                         updateHealth(-10); // 롱노트 시작을 놓치면 체력 10 감소
                         updateStatsUI();
                    }
                    // Let go too early or held too long (missed end)
                    let endTime = note.time + note.duration;
                    if (note.active && currentTime > endTime + hitWindowMiss) {
                        note.hit = true;
                        note.active = false;
                        combo = 0;
                        showJudgement('MISS', 'miss');
                        stats.miss++;
                        updateHealth(-10); // 롱노트 길게 누르기 실패 시 체력 10 감소
                        updateStatsUI();
                    }
                }
            }
        }

        // Draw Notes (Reverse order so closer notes draw on top)
        for (let i = beatmap.length - 1; i >= 0; i--) {
            let note = beatmap[i];
            if (note.hit) continue;

            // Calculate progress (0 at spawn time, 1 at hit line time)
            let timeUntilHit = note.time - currentTime;
            let p = 1.0 - (timeUntilHit / noteSpeed);

            if (note.type === 'short') {
                // Render short note if visible
                if (p > -0.2 && p < 1.2) {
                    drawShortNote(note.lane, Math.max(0, p), laneColors[note.lane]);
                }
            } else if (note.type === 'long') {
                // Render long note
                let timeUntilEnd = (note.time + note.duration) - currentTime;
                let pEnd = 1.0 - (timeUntilEnd / noteSpeed);
                
                // Clamp progress to visible bounds (음수가 되면 3D 원근감 계산이 고장나므로 0으로 고정)
                let startP = Math.max(0, p);
                let endP = Math.max(0, pEnd);

                // If currently holding, anchor the bottom of the long note to the hitline
                if (note.active) {
                    startP = 1.0; 
                }

                // 버그 수정: 머리(startP)가 꼬리(endP)보다 판정선에 가까울 때(클 때) 렌더링하도록 부등호 방향 변경
                if (startP > 0 && endP < 1.2 && startP > endP) {
                     drawLongNote(note.lane, startP, endP, laneColors[note.lane], note.active);
                }
            }
        }

        // Draw Hit Effects
        drawHitEffects();

        // Draw Key Press Feedback at bottom
        drawKeyPresses();

        requestAnimationFrame(gameLoop);
    }

    function drawHighway() {
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
        ctx.lineWidth = 1;

        // Draw lane dividers
        for (let i = 0; i <= 4; i++) {
            ctx.beginPath();
            let topX = (canvas.width / 2) - (topWidth / 2) + (topWidth / 4) * i;
            let botX = (canvas.width / 2) - (bottomWidth / 2) + (bottomWidth / 4) * i;
            ctx.moveTo(topX, topY);
            ctx.lineTo(botX, bottomY);
            ctx.stroke();
        }

        // Draw Hit Line
        ctx.beginPath();
        let hitStartX = (canvas.width / 2) - (bottomWidth / 2);
        ctx.moveTo(hitStartX, bottomY);
        ctx.lineTo(hitStartX + bottomWidth, bottomY);
        ctx.strokeStyle = 'rgba(0, 255, 255, 0.8)';
        ctx.lineWidth = 4;
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#00ffff';
        ctx.stroke();
        ctx.shadowBlur = 0; // reset
    }

    function drawShortNote(lane, p, color) {
        const m = getPerspectiveMetrics(p);
        
        let x = m.startX + (m.laneWidth * lane);
        let y = m.y;
        
        // Note thickness scales with distance (두께를 키워 시인성 대폭 향상)
        let height = 8 + (35 * Math.pow(p, 2)); 
        
        ctx.fillStyle = color;
        ctx.strokeStyle = '#ffffff'; // 하얀색 테두리 추가로 뚜렷하게 보이게 함
        ctx.lineWidth = 2 + (2 * p); // 다가올수록 테두리도 약간 두꺼워짐
        ctx.shadowBlur = 20; // 네온 발광 효과 강화
        ctx.shadowColor = color;
        
        // Draw slightly trapezoidal for 3D feel
        ctx.beginPath();
        ctx.moveTo(x + 2, y - height/2);
        ctx.lineTo(x + m.laneWidth - 2, y - height/2);
        ctx.lineTo(x + m.laneWidth + (p*10), y + height/2); // 다가올수록 밑변이 더 넓어지게 강조
        ctx.lineTo(x - (p*10), y + height/2);
        ctx.closePath();
        
        ctx.fill();
        ctx.shadowBlur = 0; // 테두리 그릴 때는 네온효과 제외하여 선명하게
        ctx.stroke(); 
    }

    function drawLongNote(lane, pStart, pEnd, color, isActive) {
        const mStart = getPerspectiveMetrics(pStart); // Bottom part of the note (closer to hitline)
        const mEnd = getPerspectiveMetrics(pEnd);     // Top part of the note (further away)
        
        let xStart = mStart.startX + (mStart.laneWidth * lane);
        let xEnd = mEnd.startX + (mEnd.laneWidth * lane);
        
        // Add glowing effect if being actively held
        ctx.fillStyle = color;
        ctx.globalAlpha = isActive ? 0.9 : 0.3; // 투명도를 더 낮춰 속이 비어보이게 강조
        
        if (isActive) {
            ctx.shadowBlur = 30; // 누르고 있을 때 빛번짐 극대화
            ctx.shadowColor = color;
        }

        ctx.beginPath();
        ctx.moveTo(xStart + 5, mStart.y);
        ctx.lineTo(xStart + mStart.laneWidth - 5, mStart.y);
        ctx.lineTo(xEnd + mEnd.laneWidth - 2, mEnd.y);
        ctx.lineTo(xEnd + 2, mEnd.y);
        ctx.closePath();
        ctx.fill();
        
        // 롱노트 정중앙을 가로지르는 하얀색 '심지' 라인 추가 (이어져 있는 느낌을 강하게 줌)
        ctx.globalAlpha = isActive ? 1.0 : 0.8;
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = isActive ? 6 : 2;
        ctx.beginPath();
        let centerStart = xStart + (mStart.laneWidth / 2);
        let centerEnd = xEnd + (mEnd.laneWidth / 2);
        ctx.moveTo(centerStart, mStart.y);
        ctx.lineTo(centerEnd, mEnd.y);
        ctx.stroke();

        ctx.shadowBlur = 0;
        ctx.globalAlpha = 1.0;
        
        // 외곽선 양옆 그리기 (형태 뚜렷하게 잡기)
        ctx.strokeStyle = color; 
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(xStart + 5, mStart.y);
        ctx.lineTo(xEnd + 2, mEnd.y);
        ctx.moveTo(xStart + mStart.laneWidth - 5, mStart.y);
        ctx.lineTo(xEnd + mEnd.laneWidth - 2, mEnd.y);
        ctx.stroke();
    }

    function drawKeyPresses() {
        const m = getPerspectiveMetrics(1.0); // Hit line metrics
        
        for (let i = 0; i < 4; i++) {
            if (keyState[i]) {
                let x = m.startX + (m.laneWidth * i);
                
                // Gradient glow
                let grad = ctx.createLinearGradient(0, bottomY, 0, bottomY - 150);
                grad.addColorStop(0, laneColors[i]);
                grad.addColorStop(1, 'rgba(0,0,0,0)');
                
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.moveTo(x, bottomY);
                ctx.lineTo(x + m.laneWidth, bottomY);
                ctx.lineTo(x + m.laneWidth - 20, bottomY - 150);
                ctx.lineTo(x + 20, bottomY - 150);
                ctx.fill();
            }
        }
    }

    function drawHitEffects() {
        const now = performance.now();
        const m = getPerspectiveMetrics(1.0);
        
        for (let i = hitEffects.length - 1; i >= 0; i--) {
            let effect = hitEffects[i];
            let age = now - effect.time;
            
            if (age > 300) { // 300ms duration
                hitEffects.splice(i, 1);
                continue;
            }

            let progress = age / 300;
            let x = m.startX + (m.laneWidth * effect.lane) + (m.laneWidth / 2);
            let y = bottomY;
            let radius = 20 + (progress * 50);
            
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.strokeStyle = effect.color;
            ctx.lineWidth = 5 * (1 - progress);
            ctx.globalAlpha = 1 - progress;
            ctx.stroke();
            ctx.globalAlpha = 1.0;
        }
    }

    startBtn.addEventListener('click', () => {
        startScreen.style.display = 'none';
        isPlaying = true;
        
        // 타이틀 원상복구 (게임오버 후 재시작 시)
        document.querySelector('#start-screen h1').innerText = "IRIS OUT";
        document.querySelector('#start-screen h1').className = "text-6xl font-black mb-4 neon-text tracking-widest";

        // Reset state
        stats = { perfect: 0, great: 0, good: 0, miss: 0 };
        combo = 0;
        currentHealth = maxHealth; // 체력 초기화
        updateHealth(0); // 바 UI 업데이트
        updateStatsUI();
        
        // Ensure beatmap is reset (all hit/active states to false)
        beatmap.forEach(n => { n.hit = false; n.active = false; });

        // Play audio and start loop
        audio.currentTime = 0;
        let playPromise = audio.play();
        
        if (playPromise !== undefined) {
            playPromise.catch(error => {
                console.error("오디오 재생 실패:", error);
                uploadStatus.innerHTML = `<span style="color:#ff0044">⚠️ 로컬 오디오 파일을 재생할 수 없습니다. 버튼을 눌러 직접 파일을 업로드해주세요.</span>`;
                startScreen.style.display = 'flex';
                isPlaying = false;
            });
        }
        
        if (isPlaying) {
            requestAnimationFrame(gameLoop);
        }
    });

    audio.addEventListener('ended', () => {
        isPlaying = false;
        startScreen.style.display = 'flex';
        document.querySelector('#start-screen h1').innerText = "CLEARED!";
        document.querySelector('#start-screen h1').className = "text-6xl font-black mb-4 neon-text tracking-widest";
        document.querySelector('#start-screen p').innerText = `Clear! PERFECT:${stats.perfect} MISS:${stats.miss}`;
        startBtn.innerText = "RESTART";
    });

</script>
