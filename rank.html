<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>명예의 전당 - 리더보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Noto Sans KR', sans-serif;
            background: radial-gradient(circle at top right, #2a2a40, #13131f);
            color: #fff;
            min-height: 100vh;
        }
        .glass-panel {
            background: rgba(30, 30, 46, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }
        /* Rank Badges */
        .rank-badge { display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 50%; font-weight: 800; margin: 0 auto; }
        .rank-1 { background: rgba(255, 215, 0, 0.2); color: #FFD700; border: 1px solid rgba(255, 215, 0, 0.5); box-shadow: 0 0 15px rgba(255, 215, 0, 0.3); }
        .rank-2 { background: rgba(192, 192, 192, 0.2); color: #E0E0E0; border: 1px solid rgba(192, 192, 192, 0.5); box-shadow: 0 0 10px rgba(192, 192, 192, 0.2); }
        .rank-3 { background: rgba(205, 127, 50, 0.2); color: #CD7F32; border: 1px solid rgba(205, 127, 50, 0.5); box-shadow: 0 0 10px rgba(205, 127, 50, 0.2); }
        .rank-other { background: rgba(255, 255, 255, 0.05); color: #9CA3AF; }
        /* Animations */
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: #06b6d4;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="p-4 sm:p-8 flex justify-center items-center relative">

    <!-- 뒤로가기 버튼 추가 -->
    <a href="index.html" class="absolute top-4 left-4 sm:top-8 sm:left-8 px-4 py-2 sm:px-5 sm:py-2.5 bg-white bg-opacity-10 hover:bg-opacity-20 border border-gray-600/50 rounded-full text-gray-300 hover:text-white font-semibold flex items-center gap-2 transition-all duration-300 backdrop-blur-md shadow-lg hover:shadow-cyan-500/20 group z-50">
        <svg class="w-5 h-5 transform group-hover:-translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
        </svg>
        <span>메인으로</span>
    </a>

    <div class="w-full max-w-4xl glass-panel rounded-2xl p-6 sm:p-10 mt-12 sm:mt-0">
        <div class="text-center mb-10">
            <h1 class="text-4xl sm:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-cyan-400 mb-2">
                LEADERBOARD
            </h1>
            <p class="text-gray-400">실시간 랭킹 순위표</p>
        </div>

        <div id="loading" class="flex flex-col items-center justify-center py-20">
            <div class="spinner mb-4"></div>
            <p class="text-gray-300">스프레드시트에서 데이터를 불러오는 중입니다...</p>
        </div>

        <div id="error-message" class="hidden bg-red-500 bg-opacity-20 border border-red-500 text-red-100 p-4 rounded-lg text-center mb-6">
            데이터를 불러올 수 없습니다.<br>
            스프레드시트의 공유 설정이 <strong>'링크가 있는 모든 사용자 보기 가능'</strong>으로 되어 있는지 확인해주세요.
        </div>

        <!-- 탭 버튼 영역 추가 -->
        <div id="tabs" class="hidden flex flex-wrap gap-3 mb-8 justify-center">
            <button class="tab-btn px-5 py-2.5 rounded-xl font-bold transition-all duration-300 shadow-lg bg-gradient-to-r from-indigo-500 to-cyan-500 text-white transform hover:scale-105" data-target="music1" onclick="switchTab('music1')">IRIS OUT</button>
            <button class="tab-btn px-5 py-2.5 rounded-xl font-bold transition-all duration-300 shadow-md bg-white bg-opacity-5 text-gray-400 hover:bg-opacity-10 hover:text-white transform hover:scale-105" data-target="music2" onclick="switchTab('music2')">Stay at Your House</button>
            <button class="tab-btn px-5 py-2.5 rounded-xl font-bold transition-all duration-300 shadow-md bg-white bg-opacity-5 text-gray-400 hover:bg-opacity-10 hover:text-white transform hover:scale-105" data-target="music3" onclick="switchTab('music3')">AIZO</button>
            <button class="tab-btn px-5 py-2.5 rounded-xl font-bold transition-all duration-300 shadow-md bg-white bg-opacity-5 text-gray-400 hover:bg-opacity-10 hover:text-white transform hover:scale-105" data-target="music4" onclick="switchTab('music4')">TETORIS</button>
            <button class="tab-btn px-5 py-2.5 rounded-xl font-bold transition-all duration-300 shadow-md bg-white bg-opacity-5 text-gray-400 hover:bg-opacity-10 hover:text-white transform hover:scale-105" data-target="music5" onclick="switchTab('music5')">Bling-Bang-Bang-Born</button>
        </div>

        <div id="table-container" class="hidden overflow-x-auto rounded-xl border border-gray-700/50 bg-black/20 shadow-inner">
            <table class="w-full text-left border-collapse whitespace-nowrap">
                <thead>
                    <tr class="bg-indigo-900 bg-opacity-40 text-indigo-200 uppercase text-xs sm:text-sm tracking-widest border-b border-indigo-500/30">
                        <th class="p-5 font-bold text-center">순위</th>
                        <th class="p-5 font-bold">플레이어</th>
                        <th class="p-5 font-bold">곡명</th>
                        <th class="p-5 font-bold text-right">달성 점수</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body" class="divide-y divide-gray-800">
                    <!-- 자바스크립트로 데이터가 여기에 렌더링됩니다 -->
                </tbody>
            </table>
        </div>
        
        <div class="mt-8 text-center">
            <button onclick="fetchLeaderboardData()" class="px-8 py-3 bg-white bg-opacity-10 hover:bg-opacity-20 border border-gray-600 transition-all rounded-full font-semibold shadow-lg hover:shadow-xl transform hover:-translate-y-1">
                🔄 랭킹 새로고침
            </button>
        </div>
    </div>

    <script>
        // 사용자님이 제공해주신 스프레드시트 ID
        const SHEET_ID = '1O6fBRijZpZArbTFQOUk6is-o8BnsN-fGU7zj8KZJPIA';
        const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;

        let allRecords = [];
        let currentTab = 'music1'; // 기본 선택 탭

        async function fetchLeaderboardData() {
            const loading = document.getElementById('loading');
            const tableContainer = document.getElementById('table-container');
            const errorMessage = document.getElementById('error-message');
            const tabs = document.getElementById('tabs');

            // UI 초기화
            loading.classList.remove('hidden');
            tableContainer.classList.add('hidden');
            errorMessage.classList.add('hidden');
            tabs.classList.add('hidden');

            try {
                const response = await fetch(SHEET_URL);
                if (!response.ok) throw new Error('Network response was not ok');
                
                const text = await response.text();
                const jsonMatch = text.match(/google\.visualization\.Query\.setResponse\(([\s\S\w]+)\)/);
                
                if (!jsonMatch || jsonMatch.length < 2) {
                    throw new Error('Invalid data format');
                }

                const data = JSON.parse(jsonMatch[1]);
                if (data.status === 'error') {
                    throw new Error(data.errors[0].message);
                }

                const rows = data.table.rows;
                allRecords = []; // 기존 데이터 초기화

                rows.forEach(row => {
                    if (!row || !row.c) return;
                    
                    const nicknameCell = row.c[1];
                    const scoreCell = row.c[2];
                    const musicCell = row.c[3];

                    if (!nicknameCell || !scoreCell) return;

                    const nickname = nicknameCell.v;
                    const scoreText = scoreCell.v;
                    const music = musicCell ? musicCell.v : '-';

                    const score = parseFloat(scoreText);

                    if (!isNaN(score)) {
                        allRecords.push({ nickname, score, music });
                    }
                });

                // 점수 기준으로 전체 내림차순 정렬
                allRecords.sort((a, b) => b.score - a.score);

                // 로딩 숨기고 탭 및 테이블 표시
                loading.classList.add('hidden');
                tabs.classList.remove('hidden');
                tableContainer.classList.remove('hidden');

                // 선택된 탭에 맞춰 테이블 렌더링
                renderLeaderboard();

            } catch (error) {
                console.error("데이터 로드 실패:", error);
                loading.classList.add('hidden');
                errorMessage.classList.remove('hidden');
            }
        }

        // 탭 변경 함수
        function switchTab(tabId) {
            currentTab = tabId;
            
            // 탭 스타일(버튼 색상) 업데이트
            document.querySelectorAll('.tab-btn').forEach(btn => {
                if(btn.dataset.target === tabId) {
                    btn.classList.add('bg-gradient-to-r', 'from-indigo-500', 'to-cyan-500', 'text-white', 'shadow-lg');
                    btn.classList.remove('bg-white', 'bg-opacity-5', 'text-gray-400', 'shadow-md');
                } else {
                    btn.classList.remove('bg-gradient-to-r', 'from-indigo-500', 'to-cyan-500', 'text-white', 'shadow-lg');
                    btn.classList.add('bg-white', 'bg-opacity-5', 'text-gray-400', 'shadow-md');
                }
            });
            
            // 랭킹 리스트에 페이드 효과 적용
            const tbody = document.getElementById('leaderboard-body');
            tbody.classList.remove('fade-in');
            void tbody.offsetWidth; // 리플로우 강제 (애니메이션 재시작)
            tbody.classList.add('fade-in');

            // 변경된 음악에 맞춰 랭킹 다시 그리기
            renderLeaderboard();
        }

        // 테이블 렌더링 함수
        function renderLeaderboard() {
            const tbody = document.getElementById('leaderboard-body');
            tbody.innerHTML = '';

            // 현재 선택된 음악(currentTab)에 해당하는 데이터만 필터링
            const filteredRecords = allRecords.filter(record => 
                record.music.toLowerCase().includes(currentTab)
            );

            // 화면에 렌더링
            if (filteredRecords.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="py-16 text-center text-gray-500"><div class="text-5xl mb-4">📭</div>아직 이 곡에 등록된 기록이 없습니다.<br>첫 번째 랭커가 되어보세요!</td></tr>`;
            } else {
                filteredRecords.forEach((record, index) => {
                    const rank = index + 1;
                    let badgeClass = "rank-other";
                    let rankIcon = rank;
                    
                    if (rank === 1) { badgeClass = "rank-1"; rankIcon = "🥇"; }
                    else if (rank === 2) { badgeClass = "rank-2"; rankIcon = "🥈"; }
                    else if (rank === 3) { badgeClass = "rank-3"; rankIcon = "🥉"; }

                    // 제목 표시 변경
                    let displayTitle = record.music;
                    if (displayTitle.toLowerCase().includes('music1')) {
                        displayTitle = 'IRIS OUT';
                    } else if (displayTitle.toLowerCase().includes('music2')) {
                        displayTitle = 'Stay at Your House'; // 모바일을 위해 긴 제목 약간 축약
                    } else if (displayTitle.toLowerCase().includes('music3')) {
                        displayTitle = 'AIZO';
                    } else if (displayTitle.toLowerCase().includes('music4')) {
                        displayTitle = 'TETORIS';
                    } else if (displayTitle.toLowerCase().includes('music5')) {
                        displayTitle = 'Bling-Bang-Bang-Born';
                    }

                    const rowHTML = `
                        <tr class="hover:bg-indigo-900/20 transition-all duration-200 group">
                            <td class="p-4 text-center w-24">
                                <div class="rank-badge ${badgeClass} text-sm sm:text-base">
                                    ${rankIcon}
                                </div>
                            </td>
                            <td class="p-4 font-bold text-base sm:text-lg text-gray-100 group-hover:text-white transition-colors">
                                ${record.nickname}
                            </td>
                            <td class="p-4 text-sm">
                                <a href="${record.music.includes('.html') ? record.music : record.music + '.html'}" class="inline-flex items-center bg-gray-800/50 hover:bg-indigo-600/30 px-3 py-1.5 rounded-lg border border-gray-700/50 hover:border-indigo-500/50 transition-all cursor-pointer text-cyan-200 hover:text-cyan-100 shadow-sm">
                                    🎵 <span class="ml-2 font-medium tracking-wide">${displayTitle}</span> 
                                    <span class="text-[10px] ml-2 opacity-50 bg-black/30 px-1.5 py-0.5 rounded">PLAY ▶</span>
                                </a>
                            </td>
                            <td class="p-4 text-right">
                                <span class="font-mono font-black text-xl sm:text-2xl text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-400 drop-shadow-md">
                                    ${record.score.toLocaleString()}
                                </span>
                                <span class="text-xs text-gray-500 ml-1">pts</span>
                            </td>
                        </tr>
                    `;
                    tbody.insertAdjacentHTML('beforeend', rowHTML);
                });
            }
        }

        // 페이지 로드 시 데이터 가져오기
        window.addEventListener('DOMContentLoaded', fetchLeaderboardData);
    </script>
</body>
</html>
