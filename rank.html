<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>명예의 전당 - 리더보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #2a2a40);
            color: #fff;
            min-height: 100vh;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .rank-1 { color: #FFD700; text-shadow: 0 0 10px rgba(255,215,0,0.5); font-size: 1.5rem; }
        .rank-2 { color: #C0C0C0; text-shadow: 0 0 10px rgba(192,192,192,0.5); font-size: 1.3rem; }
        .rank-3 { color: #CD7F32; text-shadow: 0 0 10px rgba(205,127,50,0.5); font-size: 1.2rem; }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: #6366f1;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="p-4 sm:p-8 flex justify-center items-center">

    <div class="w-full max-w-4xl glass-panel rounded-2xl p-6 sm:p-10">
        <div class="text-center mb-10">
            <h1 class="text-4xl sm:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-cyan-400 mb-2">
                LEADERBOARD
            </h1>
            <p class="text-gray-400">실시간 랭킹 순위표</p>
        </div>

        <div id="loading" class="flex flex-col items-center justify-center py-20">
            <div class="spinner mb-4"></div>
            <p class="text-gray-300">스프레드시트에서 데이터를 불러오는 중입니다...</p>
        </div>

        <div id="error-message" class="hidden bg-red-500 bg-opacity-20 border border-red-500 text-red-100 p-4 rounded-lg text-center mb-6">
            데이터를 불러올 수 없습니다.<br>
            스프레드시트의 공유 설정이 <strong>'링크가 있는 모든 사용자 보기 가능'</strong>으로 되어 있는지 확인해주세요.
        </div>

        <div id="table-container" class="hidden overflow-x-auto rounded-xl">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-indigo-600 bg-opacity-30 text-indigo-100 uppercase text-sm tracking-wider">
                        <th class="p-4 rounded-tl-xl text-center">순위</th>
                        <th class="p-4">닉네임</th>
                        <th class="p-4">플레이 음악</th>
                        <th class="p-4 text-right rounded-tr-xl">점수</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body" class="divide-y divide-gray-700 divide-opacity-50">
                    <!-- 자바스크립트로 데이터가 여기에 렌더링됩니다 -->
                </tbody>
            </table>
        </div>
        
        <div class="mt-8 text-center">
            <button onclick="fetchLeaderboardData()" class="px-6 py-2 bg-indigo-600 hover:bg-indigo-500 transition-colors rounded-full font-semibold shadow-lg">
                새로고침
            </button>
        </div>
    </div>

    <script>
        // 사용자님이 제공해주신 스프레드시트 ID
        const SHEET_ID = '1O6fBRijZpZArbTFQOUk6is-o8BnsN-fGU7zj8KZJPIA';
        
        // 구글 시트 Visualization API URL (JSON 형식으로 출력)
        const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;

        async function fetchLeaderboardData() {
            const loading = document.getElementById('loading');
            const tableContainer = document.getElementById('table-container');
            const errorMessage = document.getElementById('error-message');
            const tbody = document.getElementById('leaderboard-body');

            // UI 초기화
            loading.classList.remove('hidden');
            tableContainer.classList.add('hidden');
            errorMessage.classList.add('hidden');
            tbody.innerHTML = '';

            try {
                const response = await fetch(SHEET_URL);
                if (!response.ok) throw new Error('Network response was not ok');
                
                const text = await response.text();
                
                // Google이 반환하는 값은 순수 JSON이 아니라 함수 래퍼가 씌워져 있으므로 이를 벗겨냄
                const jsonMatch = text.match(/google\.visualization\.Query\.setResponse\(([\s\S\w]+)\)/);
                
                if (!jsonMatch || jsonMatch.length < 2) {
                    throw new Error('Invalid data format');
                }

                const data = JSON.parse(jsonMatch[1]);
                
                if (data.status === 'error') {
                    throw new Error(data.errors[0].message);
                }

                const rows = data.table.rows;
                let records = [];

                // 데이터 파싱 (구글 폼 시트 기준: 타임스탬프, 닉네임, 점수, 플레이음악 순서로 가정)
                // c[0]: Timestamp
                // c[1]: 닉네임 (entry.1326412949)
                // c[2]: 점수 (entry.1582723431)
                // c[3]: 플레이음악 (entry.1967614191)
                rows.forEach(row => {
                    if (!row || !row.c) return;
                    
                    const nicknameCell = row.c[1];
                    const scoreCell = row.c[2];
                    const musicCell = row.c[3];

                    if (!nicknameCell || !scoreCell) return;

                    const nickname = nicknameCell.v;
                    const scoreText = scoreCell.v;
                    const music = musicCell ? musicCell.v : '-';

                    // 숫자 형태로 파싱 (문자열로 들어왔을 경우 대비)
                    const score = parseFloat(scoreText);

                    // 폼 제목 행(헤더)이거나 점수가 숫자가 아닌 경우는 건너뛰기
                    if (!isNaN(score)) {
                        records.push({ nickname, score, music });
                    }
                });

                // 점수 기준으로 내림차순 정렬
                records.sort((a, b) => b.score - a.score);

                // 화면에 렌더링
                if (records.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="4" class="p-8 text-center text-gray-400">아직 등록된 기록이 없습니다.</td></tr>`;
                } else {
                    records.forEach((record, index) => {
                        const rank = index + 1;
                        let rankStyle = "font-bold text-gray-300";
                        let rankIcon = rank;
                        
                        if (rank === 1) { rankStyle = "font-black rank-1"; rankIcon = "🥇 " + rank; }
                        else if (rank === 2) { rankStyle = "font-bold rank-2"; rankIcon = "🥈 " + rank; }
                        else if (rank === 3) { rankStyle = "font-bold rank-3"; rankIcon = "🥉 " + rank; }

                        const rowHTML = `
                            <tr class="hover:bg-white hover:bg-opacity-5 transition-colors group">
                                <td class="p-4 text-center ${rankStyle} w-24">
                                    ${rankIcon}
                                </td>
                                <td class="p-4 font-semibold text-lg text-white">
                                    ${record.nickname}
                                </td>
                                <td class="p-4 text-gray-300 text-sm">
                                    <a href="${record.music.includes('.html') ? record.music : record.music + '.html'}" class="inline-block bg-white bg-opacity-10 hover:bg-opacity-30 px-3 py-1 rounded-full border border-gray-600 transition-all cursor-pointer text-cyan-100 hover:text-white shadow-sm hover:shadow-md">
                                        🎵 ${record.music} <span class="text-xs ml-1 opacity-70">▶</span>
                                    </a>
                                </td>
                                <td class="p-4 text-right font-mono font-bold text-xl text-cyan-300">
                                    ${record.score.toLocaleString()}
                                </td>
                            </tr>
                        `;
                        tbody.insertAdjacentHTML('beforeend', rowHTML);
                    });
                }

                // 로딩 숨기고 테이블 표시
                loading.classList.add('hidden');
                tableContainer.classList.remove('hidden');

            } catch (error) {
                console.error("데이터 로드 실패:", error);
                loading.classList.add('hidden');
                errorMessage.classList.remove('hidden');
            }
        }

        // 페이지 로드 시 데이터 가져오기
        window.addEventListener('DOMContentLoaded', fetchLeaderboardData);
    </script>
</body>
</html>
